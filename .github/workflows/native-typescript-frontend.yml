name: Compiler gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-typescript-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-gate:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out aot-kit-gradual
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out Coil
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jimmyhmiller/coil
          path: coil

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Build Coil
        working-directory: coil
        run: python3 scripts/dev.py build nollvm "$RUNNER_TEMP/coil"

      - name: Install JavaScript oracle dependency
        run: npm ci

      - name: Run compiler, backend, GC, workflow, and frontend gates
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          tools/gate.sh --quick
