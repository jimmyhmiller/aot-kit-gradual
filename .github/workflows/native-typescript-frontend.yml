name: Native TypeScript frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-typescript-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-graph-parity:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out aot-kit-gradual
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out Coil
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jimmyhmiller/coil
          path: coil

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.x'

      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d8a411f7c8ac83a4a2d730cf9bd # v6.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build Coil
        working-directory: coil
        run: python3 scripts/dev.py build nollvm "$RUNNER_TEMP/coil"

      - name: Install JavaScript oracle dependency
        run: npm ci

      - name: Verify pinned Go ABI and exact graph parity
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          tools/typescript-go-bridge-gate.sh
