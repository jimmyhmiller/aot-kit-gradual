[package]
name = "aot-kit-gradual"
entry = "tools/dot-dump.coil"
source-roots = ["src", "tests", "tools"]

[test]
roots = ["tests"]
# `-prop.coil` holds property tests (`defprop`). Same suite, different kind: a law over
# generated input rather than an example, discovered by `coil test` exactly the same way.
suffixes = ["-test.coil", "-prop.coil"]

[cc]
sources = ["native/typescript-go-bridge/metaprogram_stubs.c", "native/js-oracle/oracle.c"]
flags = ["-std=c11"]

# The TypeScript-Go bridge, force-loaded so the archive's STRONG definitions win over
# the weak stubs above. Build it first with tools/build-typescript-go-bridge.sh.
# Declaring it here (rather than passing --link-flag by hand) is what lets plain
# `coil test tests/whatever-test.coil` link — coil applies [link] flags to the test
# runner and to the comptime/metaprogram link alike.
# CoreFoundation and Security are required by the Go runtime in a c-archive build.
[link]
flags = ["-Wl,-force_load,.coil/build/native/typescript-go-bridge/libaot_typescript.a", "-framework", "CoreFoundation", "-framework", "Security"]
