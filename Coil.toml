[package]
name = "aot-kit-gradual"
entry = "tools/dot-dump.coil"
source-roots = ["src", "tests", "tools"]

[test]
## The mandatory local gate is deliberately bounded: structural coverage across the native
## pipeline plus one TypeScript-to-host-machine execution witness. Exhaustive generated sweeps,
## broad differential programs, and report regeneration remain in the opt-in `full` suite below.
## Keeping those in plain `coil test` made the gate take more than ten minutes, so developers could
## not reasonably run it after each change.
roots = ["tests/gate"]
suffixes = ["-gate.coil"]

[test.suites.full]
roots = ["tests"]
suffixes = ["-test.coil", "-prop.coil"]
default = false

[cc]
sources = ["native/js-oracle/oracle.c", "native/platform_compat.c", "native/gc/runtime.c"]
flags = ["-std=c11", "-DAOT_IN_MEMORY_HOST=1", "-DAOT_NATIVE_SOURCE_REV=20260831"]

# The TypeScript-Go bridge. Its ordinary strong definitions satisfy frontend
# references in both metaprograms and final executables; weak C stubs would make
# archive extraction dependent on host linker ordering. Build it first with
# tools/build-typescript-go-bridge.sh.
# Declaring it here (rather than passing --link-flag by hand) is what lets plain
# `coil test tests/whatever-test.coil` link — coil applies [link] flags to the test
# runner and to the comptime/metaprogram link alike.
[link]
flags = ["native/gc/trampoline.S", ".coil/build/native/typescript-go-bridge/libaot_typescript.a", "-lm"]

# THE OPEN-BUG SUITE, AND WHY IT IS OPT-IN.
#
# `tests/frontier/` holds one GENUINELY FAILING test per bug this compiler still has. They assert
# the CORRECT answer, so they are red today and go green the day the bug is fixed -- at which point
# the test simply stays, as the regression test it already was. Nothing is promoted and nothing is
# deleted.
#
# It is out of the green gate because a permanently red `coil test` stops answering the question
# the gate exists for: did MY change break something. `coil test --suite frontier` is therefore a
# separate standing-order command. The exhaustive suite also runs `tests/native-frontier-test.coil`,
# which regenerates `docs/NATIVE-FRONTIER.md` and compares it byte for byte.
#
# Its dedicated root and suffix keep it independent from both the bounded default runner and the
# green exhaustive suite.
[test.suites.frontier]
roots = ["tests/frontier"]
suffixes = ["-frontier.coil"]
default = false
