<emu-clause id="sec-add-two" type="abstract operation">
  <h1>
    AddTwo (
      _value_: a Number,
    ): a Number
  </h1>
  <dl class="header"></dl>
  <emu-alg>
    1. Let _first_ be AddOne(_value_).
    1. Return AddOne(_first_).
  </emu-alg>
</emu-clause>
<emu-clause id="sec-widget.prototype.read" type="built-in function">
  <h1>Widget.prototype.read ( )</h1>
  <dl class="header"></dl>
  <emu-alg>
    1. Return AddTwo(0).
  </emu-alg>
</emu-clause>
<emu-clause id="sec-widget-literal">
  <h1>Widget Literals</h1>
  <emu-grammar type="definition">
    WidgetLiteral : `widget`
  </emu-grammar>
  <emu-clause id="sec-runtime-semantics-evaluation" type="sdo">
    <h1>Runtime Semantics: Evaluation</h1>
    <dl class="header"></dl>
    <emu-grammar>WidgetLiteral : `widget`</emu-grammar>
    <emu-alg>
      1. Return AddTwo(0).
    </emu-alg>
  </emu-clause>
</emu-clause>
